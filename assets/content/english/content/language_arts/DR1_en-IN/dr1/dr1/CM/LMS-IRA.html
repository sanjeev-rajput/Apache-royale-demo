<TITLE>Destination Reading Demo - IRA</TITLE>

<!-- prevent caching in NS. NS tends to mangle cached code -->
<META HTTP-EQUIV="expires" CONTENT="0">
<META HTTP-EQUIV="Pragma" CONTENT="no-cache">

</HEAD>

<script language="JavaScript" type="text/javascript">

//<!--

var IsIE = navigator.appName.indexOf("Microsoft") != -1;
var IsNetscape = !IsIE;
var IsMac = navigator.platform.indexOf("MacPPC") != -1;
var IsWin = !IsMac;
var IsNS6 = navigator.appVersion.substr(0, 1) > "4";

var flashWindow;

//sniffer stuff
var downLoadPromptPage = "download.html";	// send user to Macromedia
var versionRequired = 6;					// minimum version required

//version booleans
var flash6Installed = false;
//****

function openFlashWindow(redirectURL)
{
	//open the flash player window, fullscreen, no chrome
	if(IsIE)
	{
		//d'oh - scrollbars=yes causes NO SCROLLBARS on IE/Win!
		flashWindow = window.open(redirectURL, "flashWindow", "fullscreen=yes, scrollbars=no, left=0, top=0");

		//d'oh - IE/Mac can't take a hint and size to full screen
		if(IsMac)
		{
			flashWindow.resizeTo(window.screen.width - 10, window.screen.height);
		}
	}
	else
	{
		//allow for bug in NS4x that computes height of task bar incorrectly
		var ah = IsNS6 ? window.screen.availHeight : window.screen.availHeight - 32;
		var aw = IsNS6 ? window.screen.availWidth : window.screen.availWidth - 10;
		if(IsNS6)
			flashWindow = window.open(redirectURL, 'flashWindow', 'toolbar=0,outerWidth=' + aw + ',outerHeight=' + ah + ',screenX=0,screenY=0');
		else
			flashWindow = window.open(redirectURL, 'flashWindow', 'toolbar=0,innerWidth=' + aw + ',innerHeight=' + ah + ',screenX=0,screenY=0');
	}
}
//-->
</script> 


<SCRIPT LANGUAGE="JavaScript1.1" type="text/javascript">
//<!--

//IE/Win - find Flash by creating objects
var isIE = (navigator.appVersion.indexOf("MSIE") != -1) ? true : false;
var isWin = (navigator.appVersion.indexOf("Windows") != -1) ? true : false;

// write vbscript detection
if(isIE && isWin)
{
	document.write('<SCR' + 'IPT LANGUAGE=VBScript\> \n');
	document.write('on error resume next \n');
	document.write('flash6Installed = (IsObject(CreateObject("ShockwaveFlash.ShockwaveFlash.6"))) \n');	
	document.write('</SCR' + 'IPT\> \n'); // break up end tag so it doesn't end our script
}

// -->
</SCRIPT>


<SCRIPT LANGUAGE="JavaScript" type="text/javascript">
//<!--

// NS and IE/Mac - use javascript detection using navigator.plugins array
function detectFlash()
{	
	if(navigator.plugins && navigator.plugins["Shockwave Flash"])
	{
		var flashDescription = navigator.plugins["Shockwave Flash"].description;

		// plugin-description looks like 'Shockwave Flash 5.0 r5'
		// get the major version & minor versions
		var majorVersion = parseInt(flashDescription.charAt(flashDescription.indexOf(".") - 1));
		var minorVersion = parseInt(flashDescription.charAt(flashDescription.indexOf("r") + 1));

		//set the booleans
		flash6Installed = majorVersion == 6 ? true : false;
	}


	// set actualVersion to highest detected version
	var actualVersion = 0;
	if(flash6Installed) actualVersion = 6;

	//alert("version = " + actualVersion);
	
	//go to download prompt page if required version not present
	if (actualVersion < versionRequired)
		window.location = downLoadPromptPage;
}


//run the detection function
detectFlash();
	
// -->
</SCRIPT>
