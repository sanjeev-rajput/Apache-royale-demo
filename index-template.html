  <!-- Typeset MathJax expressions added dynamically by Royale HTMLText. -->
  <script>
    (function () {
      if (!window.MutationObserver || !document.body) return;

      var pending = [];
      var scheduled = false;

      function isMathJaxOutput(node) {
        if (!node || node.nodeType !== 1) return false;
        if (node.matches && node.matches('mjx-container, .MathJax')) return true;
        return !!(node.closest && node.closest('mjx-container, .MathJax'));
      }

      function queueForTypesetting(node) {
        if (!node) return;
        var element = node.nodeType === 1 ? node : node.parentElement;
        if (!element || isMathJaxOutput(element)) return;
        if (pending.indexOf(element) === -1) pending.push(element);
        if (scheduled) return;
        scheduled = true;
        Promise.resolve().then(function () {
          scheduled = false;
          var targets = pending.splice(0, pending.length);
          if (window.MathJax && window.MathJax.typesetPromise && targets.length) {
            window.MathJax.typesetPromise(targets).catch(function (error) {
              console.warn('MathJax typesetting failed:', error);
            });
          }
        });
      }

      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          if (mutation.type === 'characterData') {
            queueForTypesetting(mutation.target);
            return;
          }
          Array.prototype.forEach.call(mutation.addedNodes, queueForTypesetting);
        });
      });

      observer.observe(document.body, {
        childList: true,
        characterData: true,
        subtree: true
      });

      // The MathJax script is asynchronous; typeset existing content when ready.
      var mathJaxWaitAttempts = 0;
      var waitForMathJax = window.setInterval(function () {
        mathJaxWaitAttempts++;
        if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
          window.clearInterval(waitForMathJax);
          window.MathJax.startup.promise.then(function () {
            return window.MathJax.typesetPromise([document.body]);
          }).catch(function (error) {
            console.warn('MathJax startup/typesetting failed:', error);
          });
        } else if (mathJaxWaitAttempts >= 200) {
          window.clearInterval(waitForMathJax);
          console.warn('MathJax did not load. Check assets/libs/mathjax/es5/tex-chtml.js.');
        }
      }, 50);
    })();
  </script>
